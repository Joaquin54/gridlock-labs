# Dev stack. No local Postgres: the backend reads DATABASE_URL from backend/.env
# (gitignored, append ?sslmode=require) and talks to the hosted Tiger Data instance.
# For a no-database run, layer docker-compose.offline.yml — see the README.
services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      # Non-secret and fixed to the frontend's origin, so CORS does not depend on
      # whatever CORS_ORIGINS happens to be in backend/.env.
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/drizzle.config.ts:/app/drizzle.config.ts
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "process.exit((await fetch('http://127.0.0.1:3000/health')).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # The browser runs on the host, so it reaches the backend through the
      # published port — never through the compose service name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/public:/app/public
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
